name: continuous integration
on: push
jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    needs: []
    continue-on-error: true
    steps:
      - name: checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        # https://github.com/actions/checkout

      - name: set up pnpm
        uses: pnpm/action-setup@v2
        # https://github.com/pnpm/action-setup
        with:
          version: 10.28.1

      - name: set up node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        # https://github.com/actions/setup-node
        with:
          node-version: '24.x'
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile --recursive

      - name: audit
        run: pnpm audit --prod
    on:
      push:
        branches:
          - default

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: []
    env:
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
      PUBLIC_CANONICAL_BASE_URL: ${{ vars.PUBLIC_CANONICAL_BASE_URL }}
      STORYBLOK_ACCESS_TOKEN: ${{ secrets.STORYBLOK_ACCESS_TOKEN }}
    steps:
      - name: checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        # https://github.com/actions/checkout

      - name: set up pnpm
        uses: pnpm/action-setup@v2
        # https://github.com/pnpm/action-setup
        with:
          version: 10.28.1

      - name: set up node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        # https://github.com/actions/setup-node
        with:
          node-version: '24.x'
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile --recursive

      - name: lint
        run: pnpm run --recursive lint

  test:
    name: test
    runs-on: ubuntu-latest
    needs: []
    env:
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
      PUBLIC_CANONICAL_BASE_URL: ${{ vars.PUBLIC_CANONICAL_BASE_URL }}
      STORYBLOK_ACCESS_TOKEN: ${{ secrets.STORYBLOK_ACCESS_TOKEN }}
    steps:
      - name: checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        # https://github.com/actions/checkout

      - name: set up pnpm
        uses: pnpm/action-setup@v2
        # https://github.com/pnpm/action-setup
        with:
          version: 10.28.1

      - name: set up node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        # https://github.com/actions/setup-node
        with:
          node-version: '24.x'
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile --recursive

      - name: test
        run: pnpm run --recursive test

  api:
    name: build api
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORGANISATION_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
      VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
    steps:
      - name: checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        # https://github.com/actions/checkout
        with:
          submodules: true

      - name: set up pnpm
        uses: pnpm/action-setup@v2
        # https://github.com/pnpm/action-setup
        with:
          version: 10.28.1

      - name: set up node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        # https://github.com/actions/setup-node
        with:
          node-version: '24.x'
          cache: pnpm

      - name: install dependencies
        run: |
          pnpm install --dir search --frozen-lockfile
          pnpm install --dir api --frozen-lockfile

      - name: get search data
        run: pnpm run --dir search get-data

      - name: build search
        run: pnpm run --dir search build

      - name: build api
        run: pnpm run --dir api build:vercel

  app:
    name: build & deploy app
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORGANISATION_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_APP_PROJECT_ID }}
      VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
      PUBLIC_CANONICAL_BASE_URL: ${{ vars.PUBLIC_CANONICAL_BASE_URL }}
      ISR_BYPASS_TOKEN: ${{ secrets.ISR_BYPASS_TOKEN }}
      STORYBLOK_ACCESS_TOKEN: ${{ secrets.STORYBLOK_ACCESS_TOKEN }}
    steps:
      - name: checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        # https://github.com/actions/checkout

      - name: set up pnpm
        uses: pnpm/action-setup@v2
        # https://github.com/pnpm/action-setup
        with:
          version: 10.28.1

      - name: set up node
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        # https://github.com/actions/setup-node
        with:
          node-version: '24.x'
          cache: pnpm

      - name: install dependencies
        run: pnpm install --dir app --frozen-lockfile

      - name: build app
        run: pnpm run --dir app build

      - name: deploy app
        run: pnpm --dir app deploy:vercel --prod --prebuilt --token=${{ secrets.VERCEL_ACCESS_TOKEN }}
        if: ${{ github.ref == 'refs/heads/default' }}

      - name: deploy app preview
        run: pnpm --dir app deploy:vercel --prebuilt --token=${{ secrets.VERCEL_ACCESS_TOKEN }}
        if: ${{ github.ref != 'refs/heads/default' }}
